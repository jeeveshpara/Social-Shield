services:
  # Backend Web Service (Render Free Tier)
  - type: web
    name: socialshield-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: socialshield-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: THREAT_INTEL_TIMEOUT_SECONDS
        value: 6
      - key: THREAT_INTEL_MAX_CALLS_PER_MINUTE
        value: 30

databases:
  # PostgreSQL Database (Render Free Tier)
  - name: socialshield-db
    region: oregon
    plan: free
    databaseName: socialshield
    user: socialshield_user
